deploymentType: deployment

ingress:
  enabled: enable
  className: ""
  annotations:
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: staging.obelearn.me
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: front.obelearn.me
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []


resources:
  limits:
    cpu: 1024m
    memory: 1024Mi
  requests:
    cpu: 100m
    memory: 250Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 700
  targetMemoryUtilizationPercentage: 240

nodeSelector:
  enviroment: "development"



data:
  enabled: true
  entrypoint: |
    #!/bin/bash
    ./start
