replicaCount: 2

image:
  repository: 204673261402.dkr.ecr.eu-west-1.amazonaws.com/obelearn-frontend
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 3000

readinessProbe:
  httpGet:
    path: /api/v1/health-check/
    port: 3000
  initialDelaySeconds: 10
  timeoutSeconds: 10
  periodSeconds: 5
livenessProbe:
  httpGet:
    path: /api/v1/health-check/
    port: 3000
  initialDelaySeconds: 5
  periodSeconds: 10

tolerations: []

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
    - topologyKey: kubernetes.io/hostname
      labelSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - obelearn-frontend
