deploymentType: deployment

ingress:
  enabled: enable
  className: ""
  annotations:
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: www.ealpha.net
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []


resources:
  limits:
    cpu: 1024m
    memory: 1024Mi
  requests:
    cpu: 100m
    memory: 250Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 700
  targetMemoryUtilizationPercentage: 240

nodeSelector:
  environment: "ingress"



data:
  enabled: true
  entrypoint: |
    #!/bin/bash
    ./start
